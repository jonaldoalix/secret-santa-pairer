services:
  secret-santa-pairer:
    build: .
    container_name: secret-santa-pairer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3024"
      MUSEUM_MODE: "true"
      NOTIFY_PROVIDER: "stub"
      SEED_MUSEUM_DEMO: "true"
    ports:
      # fsb-03 Tailscale bind — see Nathan docs/PORTS.md
      - "100.64.0.7:8100:3024"
